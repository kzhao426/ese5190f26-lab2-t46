; ESE5190 Lab 2 - ATmega328PB Xplained Mini, register-level C.
[platformio]
default_envs = xplained328pb
src_dir = .

[env:xplained328pb]
platform = platformio/atmelavr@5.3.0
board = ATmega328PB
board_build.f_cpu = 16000000L
; Build Part E from src/.
build_src_filter = -<*> +<src/>
build_flags = -Wextra

; Use the on-board mEDBG ISP programmer, not a serial bootloader.
platform_packages = platformio/tool-avrdude@1.80100.0
upload_protocol = custom
upload_flags =
    -C
    "${platformio.packages_dir}/tool-avrdude/avrdude.conf"
    -p
    $BOARD_MCU
    -c
    xplainedmini
    -P
    usb
upload_command = avrdude $UPLOAD_FLAGS -U "flash:w:$SOURCE:i"

; PlatformIO Monitor uses 8N1. The course UART library transmits 8N2;
; use VS Code Serial Monitor with 8N2 for the Part E output.
monitor_speed = 9600
; If multiple serial devices are connected, set the board's actual COM port:
; monitor_port = COM5

[env:part_f]
extends = env:xplained328pb
build_src_filter = -<*> +<lab2c3.c>
